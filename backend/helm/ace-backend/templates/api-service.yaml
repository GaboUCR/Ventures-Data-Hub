apiVersion: v1
kind: Service
metadata:
  name: {{ include "ace-backend.fullname" . }}-api
  labels:
    {{- include "ace-backend.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ace-backend.fullname" . }}-api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
      protocol: TCP
      name: http
  type: ClusterIP
